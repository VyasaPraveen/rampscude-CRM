# Ramps Cube CRM — Apache/LiteSpeed config, deployed as .htaccess in the crm docroot.
# (Canonical source in the repo; the deploy copies this to out/.htaccess.)
DirectoryIndex index.html
ErrorDocument 404 /404.html

# Ensure the Authorization: Bearer header reaches api.php (some servers strip it).
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteCond %{HTTP:Authorization} .
  RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
</IfModule>
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

# HTTPS is enforced by the Hostinger/LiteSpeed platform (301 + upgrade-insecure-requests).

# --- Security headers -------------------------------------------------------
<IfModule mod_headers.c>
  # Force HTTPS for a year (SSL is live for this host).
  Header always set Strict-Transport-Security "max-age=31536000"
  # Block MIME-sniffing, clickjacking, and referrer leakage.
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  # Disable device APIs the app never uses.
  Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
  # Cross-origin isolation: keep this document's browsing context, and any resource it
  # serves, walled off from other origins so a malicious page cannot read or drive it.
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header always set Cross-Origin-Resource-Policy "same-origin"
  # No Flash/PDF cross-domain policy files are honoured anywhere on the host.
  Header always set X-Permitted-Cross-Domain-Policies "none"
  # Content Security Policy. The app is fully self-hosted and only talks to its own
  # /api.php, so everything is locked to 'self': no external scripts, styles, images,
  # fonts or network calls can load — blocking injected malware and data exfiltration.
  # 'unsafe-inline' for scripts/styles is required by Next.js static export (inline
  # hydration data + inline styles); a static export cannot use per-request nonces.
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
</IfModule>

# Never cache the service worker, HTML shell, or the API, so updates are picked up.
<FilesMatch "(sw\.js|index\.html|404\.html|api\.php)$">
  <IfModule mod_headers.c>
    Header set Cache-Control "no-cache, no-store, must-revalidate"
  </IfModule>
</FilesMatch>

# Long-cache fingerprinted static assets.
<IfModule mod_headers.c>
  <FilesMatch "\.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
</IfModule>

# Never serve stray config/secrets if one ever lands in the docroot (defense in depth).
# NB: intentionally does not touch /.well-known/ so ACME SSL renewal keeps working.
<FilesMatch "\.(env|conf|sql|log|bak)$">
  Require all denied
</FilesMatch>
